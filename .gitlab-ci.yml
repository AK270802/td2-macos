# WorkPulse Agent (Rust + Tauri) — build & package on all three platforms.
# Runners: windows (shell/tags: windows), macos (tags: macos), linux (docker).

stages:
  - test
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

.rust-cache: &rust-cache
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cargo/
      - target/

test:linux:
  stage: test
  image: rust:1
  tags: [linux]
  <<: *rust-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev
      librsvg2-dev perl xdotool xprintidle libxdo-dev pkg-config
  script:
    - cargo test --workspace
    - cargo clippy --workspace -- -D warnings || true

build:windows:
  stage: build
  tags: [windows]
  <<: *rust-cache
  script:
    - cd app; npm ci; cd ..
    - cargo test --workspace
    - cd app; npm run tauri build
  artifacts:
    paths:
      - target/release/bundle/nsis/*.exe
    expire_in: 30 days

build:linux-deb:
  stage: build
  image: rust:1
  tags: [linux]
  <<: *rust-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev
      librsvg2-dev perl nodejs npm libxdo-dev pkg-config
  script:
    - cd app; npm ci; cd ..
    - cd app; npm run tauri build -- --bundles deb
  artifacts:
    paths:
      - target/release/bundle/deb/*.deb
    expire_in: 30 days

build:macos-dmg:
  stage: build
  tags: [macos]
  <<: *rust-cache
  script:
    - cd app && npm ci && cd ..
    - cd app && npm run tauri build -- --bundles dmg
    # Signing + notarization require APPLE_CERTIFICATE / APPLE_ID CI variables:
    # https://tauri.app/distribute/sign/macos/
  artifacts:
    paths:
      - target/release/bundle/dmg/*.dmg
    expire_in: 30 days
