
name: WorkPulse Agent - Build & Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            xdotool \
            xprintidle \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build Tauri application
        working-directory: app
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-Windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            nodejs \
            npm \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri DEB
        working-directory: app
        run: npm run tauri build -- --bundles deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-Linux-DEB
          path: target/release/bundle/deb/*.deb
          retention-days: 30

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri DMG
        working-directory: app
        run: npm run tauri build -- --bundles dmg

      # Signing and notarization can be added later using
      # Apple certificates and GitHub Actions secrets.

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-macOS
          path: target/release/bundle/dmg/*.dmg
          retention-days: 30
