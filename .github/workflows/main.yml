
name: WorkPulse Agent - Build & Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            xdotool \
            xprintidle \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # workpulse-app's build.rs checks that its bundled `agentd` resource
      # exists on disk at compile time -- normally satisfied by Tauri's
      # own beforeBuildCommand lifecycle hook during `tauri build`, but
      # plain `cargo test`/`cargo clippy` never trigger that hook, so it
      # has to be built explicitly here first.
      - name: Build agentd
        run: cargo build --release -p agentd

      - name: Run tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
        run: cargo test --workspace

      - name: Run Clippy
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Same as the `test` job: plain `cargo test` never runs Tauri's
      # beforeBuildCommand, which is what normally builds agentd first
      # during `tauri build` -- this job runs cargo test standalone, on its
      # own runner/checkout, so it needs its own copy of the binary too.
      - name: Build agentd
        run: cargo build --release -p agentd

      - name: Run Rust tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd.exe":"agentd.exe"}}}'
        run: cargo test --workspace

      - name: Build Tauri application
        working-directory: app
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd.exe":"agentd.exe"}}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-Windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            nodejs \
            npm \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri DEB
        working-directory: app
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-Linux-DEB
          path: target/release/bundle/deb/*.deb
          retention-days: 30

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri DMG
        working-directory: app
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles dmg

      # Signing and notarization can be added later using
      # Apple certificates and GitHub Actions secrets.

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-macOS
          path: target/release/bundle/dmg/*.dmg
          retention-days: 30
