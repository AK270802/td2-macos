
name: WorkPulse Agent - Build & Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            xdotool \
            xprintidle \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libwayland-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # workpulse-app's build.rs checks that its bundled `agentd` resource
      # exists on disk at compile time -- normally satisfied by Tauri's
      # own beforeBuildCommand lifecycle hook during `tauri build`, but
      # plain `cargo test`/`cargo clippy` never trigger that hook, so it
      # has to be built explicitly here first.
      - name: Build agentd
        run: cargo build --release -p agentd

      - name: Run tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
        run: cargo test --workspace

      - name: Run Clippy
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            perl \
            nodejs \
            npm \
            libxdo-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libwayland-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri DEB
        working-directory: app
        env:
          TAURI_CONFIG: '{"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-Linux-DEB
          path: target/release/bundle/deb/*.deb
          retention-days: 30

  build-macos:
    name: Build macOS DMG (universal)
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-latest runners are Apple Silicon; without both targets the
      # DMG only carries an arm64 slice and Intel Macs refuse to launch it
      # ("this application is not supported on this Mac").
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Tauri's `--target universal-apple-darwin` only lipo-merges the
      # src-tauri crate's own binary. agentd is bundled as a raw external
      # resource (not compiled as part of that crate), so it needs its own
      # per-arch build + lipo merge before packaging, placed at the same
      # target/release/agentd path the resources mapping below expects.
      - name: Build agentd (universal)
        run: |
          cargo build --release -p agentd --target aarch64-apple-darwin
          cargo build --release -p agentd --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/agentd \
            target/aarch64-apple-darwin/release/agentd \
            target/x86_64-apple-darwin/release/agentd

      - name: Build Tauri DMG (universal)
        working-directory: app
        env:
          # beforeBuildCommand's own `cargo build -p agentd` only builds the
          # host arch and would clobber the universal binary built above, so
          # override it here to skip that and just run the frontend build.
          TAURI_CONFIG: '{"build":{"beforeBuildCommand":"npm run build"},"bundle":{"resources":{"../../target/release/agentd":"agentd"}}}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      # Signing and notarization can be added later using
      # Apple certificates and GitHub Actions secrets.

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-macOS
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
