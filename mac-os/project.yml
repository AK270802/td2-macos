# XcodeGen spec — generates EffiLens.xcodeproj on macOS (never hand-edit pbxproj on Windows).
#   brew install xcodegen && xcodegen generate
name: EffiLens
options:
  bundleIdPrefix: com.baseel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"   # override: xcodebuild MACOSX_DEPLOYMENT_TARGET=15.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # The embed-agent phase writes into the bundle; it declares no inputs/outputs.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      CODE_SIGN_IDENTITY: "-"            # ad-hoc: unsigned dev builds
      CODE_SIGN_STYLE: Manual
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      CODE_SIGN_IDENTITY: "-"            # CI release passes CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM on the command line
      CODE_SIGN_STYLE: Manual
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
packages:
  EffiLensKit:
    path: .
targets:
  EffiLens:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/DesignSystem
      - path: Sources/Features
      - path: Resources/Assets.xcassets
    dependencies:
      - package: EffiLensKit
        product: EffiLensKit
      - sdk: ServiceManagement.framework
    postCompileScripts:
      - name: Embed Rust agent + LaunchAgent
        script: "\"${SRCROOT}/Scripts/embed-agent.sh\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baseel.effilens.mac
        PRODUCT_NAME: EffiLens
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/EffiLens.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          EFFILENS_API_BASE_URL: https://dev-workpulse-api.baseel.com
          EFFILENS_PORTAL_URL: https://dev-workpulse.baseel.com
        Release:
          EFFILENS_API_BASE_URL: https://dev-workpulse-api.baseel.com
          EFFILENS_PORTAL_URL: https://dev-workpulse.baseel.com
schemes:
  EffiLens:
    build:
      targets:
        EffiLens: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: EffiLensKit/EffiLensKitTests
    archive:
      config: Release
